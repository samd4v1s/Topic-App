<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Topic Modeler - Serverless</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><text y='32' font-size='32'>📊</text></svg>">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background: #f5f5f5;
        }
        #root {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.31.1/build/stlite.js"></script>
    <script>
        // Wait for stlite to be defined, then mount
        function initStlite() {
            if (typeof stlite !== 'undefined') {
                stlite.mount(
                    {
                        requirements: ["scikit-learn", "pandas", "numpy"],
                        entrypoint: "app.py",
                        files: {
                            "app.py": {
                                url: "./src/app.py"
                            },
                            "pyodide_topic_modeler.py": {
                                url: "./src/pyodide_topic_modeler.py"
                            }
                        }
                    },
                    document.getElementById("root")
                );
            } else {
                // Retry in 100ms if stlite isn't ready yet
                setTimeout(initStlite, 100);
            }
        }
        initStlite();
    </script>
</body>
</html>
