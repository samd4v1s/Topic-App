<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Topic Modeler - Serverless</title>
    <script defer src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.31.1/build/stlite.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background: #f5f5f5;
        }
        #root {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script>
        stlite.mount(
            {
                requirements: ["scikit-learn", "pandas", "numpy"],
                entrypoint: "app.py",
                files: {
                    "app.py": {
                        url: "./app.py"
                    },
                    "pyodide_topic_modeler.py": {
                        url: "./pyodide_topic_modeler.py"
                    }
                }
            },
            document.getElementById("root")
        );
    </script>
</body>
</html>
