[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "topic-app"
version = "0.1.0"
description = "BERTopic-based backend module for topic modeling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bertopic>=0.17.0",
    "safetensors>=0.4.0",
    "pandas>=2.2.0",
    "sentence-transformers>=3.0.0",
    "umap-learn>=0.5.6",
    "hdbscan>=0.8.37",
    "scikit-learn>=1.5.0",
    "openai>=1.0.0",
    "streamlit>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
